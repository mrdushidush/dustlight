# Dustlight CI. Dormant until the repo has a GitHub remote (ADR-0006).
# Runs the same checks as tools/scripts/ci.ps1 except the smoke test, which needs
# game data and a desktop. Note: upstream's workflows in this folder also run on
# push; review them (secrets, auto-format commits, releases) before publishing.

name: HD CI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        shell: powershell
        run: |
          python -m pip install clang-format==18.1.8
          git config core.hooksPath tools/git-hooks

      - name: Local CI script
        shell: powershell
        run: |
          & tools/scripts/ci.ps1
          exit $LASTEXITCODE
